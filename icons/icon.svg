<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="128" height="128" rx="24" ry="24" fill="url(#bg)"/>
  <!-- Record button outer ring -->
  <circle cx="64" cy="58" r="30" fill="none" stroke="#e53935" stroke-width="4"/>
  <!-- Record button inner filled circle -->
  <circle cx="64" cy="58" r="16" fill="#e53935"/>
  <!-- REC text -->
  <text x="64" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#e53935" letter-spacing="3">REC</text>
